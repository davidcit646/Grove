name: Publish Grove 0.1.29 alpha

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-0.1.29-alpha.yml

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download passing APK
        run: gh run download 36470185211 --repo "$GITHUB_REPOSITORY" --name grove-debug-apk --dir release

      - name: Publish prerelease
        run: |
          mv release/app-debug.apk release/Grove-Launcher-0.1.29-alpha.apk
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Grove Launcher 0.1.29 alpha

          First-run setup now has larger type, a progress indicator, themed visual cards, app icons in the pin picker, and clearer contact and file access explanations. The swipe-practice page is skipped when both swipes are disabled; with one enabled it practices only that gesture.

          Built and tested by Android workflow run 36470185211 from commit c21dc9b38829563e0f3ce3e2e88f1931d60c94bf. This is a development-signed APK; Android may reject installation over an older build signed with a different key. On-device layout remains to be verified.
          NOTES
          gh release create v0.1.29-alpha release/Grove-Launcher-0.1.29-alpha.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target c21dc9b38829563e0f3ce3e2e88f1931d60c94bf \
            --title "Grove Launcher 0.1.29 alpha" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease \
            --latest=false
