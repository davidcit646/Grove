name: Publish Grove 0.1.27 alpha

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-0.1.27-alpha.yml

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download passing APK
        run: gh run download 36460155989 --repo "$GITHUB_REPOSITORY" --name grove-debug-apk --dir release

      - name: Publish prerelease
        run: |
          mv release/app-debug.apk release/Grove-Launcher-0.1.27-alpha.apk
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Grove Launcher 0.1.27 alpha

          - Guided first-run setup for swipes, home controls, pinned apps, and optional contact and file search, with clear permission explanations.
          - Separate Contact search and File search switches that hide disabled results and stop indexing.
          - Wallpaper preview carousel with swipe and arrow navigation, Home/Lock/Both destination choices, and a retry state for failed downloads.
          - Home long-press practice, a one-time widget tip, and a setting to replay the tutorials.

          Built and tested by Android workflow run 36460155989 from commit 4a6d50ab1226cf69682fa45232c919c1122ec95c. This is a development-signed APK; Android may reject installation over an older build signed with a different key. Device behavior and Google Play approval remain unverified.
          NOTES
          gh release create v0.1.27-alpha release/Grove-Launcher-0.1.27-alpha.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target 4a6d50ab1226cf69682fa45232c919c1122ec95c \
            --title "Grove Launcher 0.1.27 alpha" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease \
            --latest=false
