name: Publish Grove 0.1.26 alpha

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-0.1.26-alpha.yml

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download passing APK
        run: gh run download 36454097029 --repo "$GITHUB_REPOSITORY" --name grove-debug-apk --dir release

      - name: Publish prerelease
        run: |
          mv release/app-debug.apk release/Grove-Launcher-0.1.26-alpha.apk
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Grove Launcher 0.1.26 alpha

          This build includes contact search and contact actions, the updated shared UI, and Rust-backed search and file classification.

          Built from the passing Android build workflow run 36454097029. This APK uses a development signing key. If Android refuses to install it over an older Grove build, the older build may have a different signature.
          NOTES
          gh release create v0.1.26-alpha release/Grove-Launcher-0.1.26-alpha.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Grove Launcher 0.1.26 alpha" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease \
            --latest=false
