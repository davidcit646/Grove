name: Android build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install 'platforms;android-36' 'ndk;27.3.13750724'
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path rust/grove-core/Cargo.toml
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug
      - name: Missing signing secret fails before artifact checks
        run: |
          if env -u GROVE_SIGNING_PASSWORD bash scripts/verify-release.sh > "$RUNNER_TEMP/negative-signing.log" 2>&1; then
            echo 'Missing signing password did not fail' >&2
            exit 1
          fi
          grep -F 'GROVE_SIGNING_PASSWORD is required' "$RUNNER_TEMP/negative-signing.log"
      - name: Build and verify signed release
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          GROVE_SIGNING_PASSWORD: ${{ secrets.GROVE_SIGNING_PASSWORD }}
        run: |
          test -n "$GROVE_SIGNING_PASSWORD" || { echo 'GROVE_SIGNING_PASSWORD is required' >&2; exit 1; }
          ./gradlew assembleRelease bundleRelease
          bash scripts/verify-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: grove-debug-apk
          if-no-files-found: error
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload signed release
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: grove-signed-release
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            release-checksums.txt
            release-provenance.txt
