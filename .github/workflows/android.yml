name: Android build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install 'platforms;android-36' 'ndk;27.3.13750724'
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path rust/grove-core/Cargo.toml
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug
      - name: Build and verify signed release APK
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          GROVE_SIGNING_PASSWORD: ${{ secrets.GROVE_SIGNING_PASSWORD }}
        run: |
          if [ -z "$GROVE_SIGNING_PASSWORD" ]; then
            echo 'GROVE_SIGNING_PASSWORD is required for release artifacts' >&2
            exit 1
          fi
          ./gradlew assembleRelease bundleRelease
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk |
            grep -Fi '6e34977d69ed454a5b8ac6b234cb2d2403903b33ed19a6be1c5abd044fae6397'
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | grep -F 'jar verified.'
          keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab |
            grep -Fi '6E:34:97:7D:69:ED:45:4A:5B:8A:C6:B2:34:CB:2D:24:03:90:3B:33:ED:19:A6:BE:1C:5A:BD:04:4F:AE:63:97'
          zipalign="$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -1)"
          test -n "$zipalign"
          "$zipalign" -c -P 16 -v 4 app/build/outputs/apk/release/app-release.apk
          readelf="$ANDROID_HOME/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for library in app/build/rustJniLibs/*/*.so; do
            "$readelf" -lW "$library" | awk '$1 == "LOAD" { print $NF }' |
              while read -r alignment; do test "$((alignment))" -ge 16384; done
          done
          sha256sum app/build/outputs/apk/release/app-release.apk app/build/outputs/bundle/release/app-release.aab > release-checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: grove-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload signed release APK
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: grove-signed-release
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            release-checksums.txt
