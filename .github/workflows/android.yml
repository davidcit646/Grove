name: Android build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install 'platforms;android-36' 'ndk;27.3.13750724'
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --manifest-path rust/grove-core/Cargo.toml
      - run: cargo test --locked --manifest-path rust/grove-core/Cargo.toml
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug
      - name: Native bridge parity and full JVM suite
        run: |
          cargo build --locked --manifest-path rust/grove-core/Cargo.toml
          ./gradlew testDebugUnitTest -PgroveNativeTests=true --rerun-tasks
      - name: Audit Rust dependency advisories
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --file rust/grove-core/Cargo.lock --json | tee cargo-audit.json
      - name: Compare search kernels
        run: |
          rustc -O verification/performance/search-benchmark.rs -o "$RUNNER_TEMP/search-benchmark"
          "$RUNNER_TEMP/search-benchmark" | tee search-benchmark.csv
      - name: Missing signing secret fails before artifact checks
        run: |
          if env -u GROVE_SIGNING_PASSWORD bash scripts/verify-release.sh > "$RUNNER_TEMP/negative-signing.log" 2>&1; then
            echo 'Missing signing password did not fail' >&2
            exit 1
          fi
          grep -F 'GROVE_SIGNING_PASSWORD is required' "$RUNNER_TEMP/negative-signing.log"
      - name: Build and verify signed release
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          GROVE_SIGNING_PASSWORD: ${{ secrets.GROVE_SIGNING_PASSWORD }}
        run: |
          test -n "$GROVE_SIGNING_PASSWORD" || { echo 'GROVE_SIGNING_PASSWORD is required' >&2; exit 1; }
          ./gradlew assembleRelease bundleRelease
          bash scripts/verify-release.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: grove-source-verification
          path: |
            cargo-audit.json
            search-benchmark.csv
            rust/grove-core/src/*.rs
            rust/grove-core/Cargo.lock
            app/build/reports/lint-results-debug.xml
            app/build/test-results/testDebugUnitTest/*.xml
      - uses: actions/upload-artifact@v7
        with:
          name: grove-debug-apk
          if-no-files-found: error
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload signed release
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: grove-signed-release
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            release-checksums.txt
            release-provenance.txt
      - name: Publish stable release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid stable version" >&2; exit 1; }
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists" >&2
            exit 1
          fi
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/Grove-Launcher-$TAG.apk"
          cp app/build/outputs/bundle/release/app-release.aab "release/Grove-Launcher-$TAG.aab"
          cp release-checksums.txt release-provenance.txt release/
          {
            echo "Grove Launcher $VERSION"
            echo
            echo "Verified stable Grove release."
            echo
            echo "Built and verified from commit $GITHUB_SHA."
            echo "Signed APK and AAB, certificate, native ABIs, alignment, and checksums were verified by CI."
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Grove Launcher $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --latest
