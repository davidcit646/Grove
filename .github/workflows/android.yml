name: Android build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install 'platforms;android-36' 'ndk;27.3.13750724'
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path rust/grove-core/Cargo.toml
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug
      - name: Build and verify signed release APK
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          GROVE_SIGNING_PASSWORD: ${{ secrets.GROVE_SIGNING_PASSWORD }}
        run: |
          if [ -z "$GROVE_SIGNING_PASSWORD" ]; then
            echo 'GROVE_SIGNING_PASSWORD is not configured; signed APK unavailable'
            exit 0
          fi
          ./gradlew assembleRelease
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk |
            grep -Fi '6e34977d69ed454a5b8ac6b234cb2d2403903b33ed19a6be1c5abd044fae6397'
          echo 'SIGNED_READY=true' >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: grove-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload signed release APK
        if: ${{ env.SIGNED_READY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: grove-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
