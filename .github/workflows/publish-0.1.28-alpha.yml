name: Publish Grove 0.1.28 alpha

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-0.1.28-alpha.yml

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download passing APK
        run: gh run download 36468282234 --repo "$GITHUB_REPOSITORY" --name grove-debug-apk --dir release

      - name: Publish prerelease
        run: |
          mv release/app-debug.apk release/Grove-Launcher-0.1.28-alpha.apk
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Grove Launcher 0.1.28 alpha

          Fixes the Wikimedia Commons wallpaper previews that failed for red, orange, blue, brown, black and white, and other scaled images after Wikimedia redirected them to thumb.wikimedia.org. The picker now keeps Previous, Next, and credits visible when preview text grows, and portrait previews crop photos without stretching.

          Built and tested by Android workflow run 36468282234 from commit 7b90b1339c5f6d969f08b118ede93bc21340216e. This is a development-signed APK; Android may reject installation over an older build signed with a different key. On-device wallpaper behavior remains to be verified.
          NOTES
          gh release create v0.1.28-alpha release/Grove-Launcher-0.1.28-alpha.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target 7b90b1339c5f6d969f08b118ede93bc21340216e \
            --title "Grove Launcher 0.1.28 alpha" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease \
            --latest=false
