name: Build Grove APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract Grove source
        run: |
          unzip -q Grove-Launcher-0.1.5-source.zip
          chmod +x grove-launcher/gradlew

      - name: Build Grove APK
        working-directory: grove-launcher
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload Grove APK
        uses: actions/upload-artifact@v4
        with:
          name: Grove-Launcher-APK
          path: grove-launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
