name: Publish verified Grove prerelease
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing prerelease tag (for example v0.1.31-alpha)
        required: true
        type: string
      expected_sha:
        description: Exact 40-character commit SHA the tag must reference
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GROVE_SIGNING_PASSWORD: ${{ secrets.GROVE_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify tag and prevent duplicate release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$EXPECTED_SHA"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists" >&2
            exit 1
          fi
          test -n "$GROVE_SIGNING_PASSWORD" || { echo 'Signing secret required' >&2; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install 'platforms;android-36' 'ndk;27.3.13750724'
      - uses: dtolnay/rust-toolchain@stable
      - uses: gradle/actions/setup-gradle@v4
      - run: cargo test --manifest-path rust/grove-core/Cargo.toml
      - run: ./gradlew assembleDebug testDebugUnitTest lintDebug assembleRelease bundleRelease
      - run: bash scripts/verify-release.sh
      - name: Publish only verified same-commit artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          mkdir release
          cp app/build/outputs/apk/release/app-release.apk "release/Grove-Launcher-$RELEASE_TAG.apk"
          cp app/build/outputs/bundle/release/app-release.aab "release/Grove-Launcher-$RELEASE_TAG.aab"
          cp release-checksums.txt release-provenance.txt release/
          {
            echo "Grove Launcher $RELEASE_TAG"
            echo
            echo "Built and verified from commit $EXPECTED_SHA in this workflow run."
            echo "APK and AAB certificate, three native ABIs, alignment, and checksums were verified."
            echo "On-device install and upgrade validation is tracked separately."
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" \
            --target "$EXPECTED_SHA" --title "Grove Launcher $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease --latest=false
